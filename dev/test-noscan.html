<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>no-rescan fixture</title>
<style>
  body { background: #0e0e10; color: #efeff1; font: 14px/1.4 system-ui, "Segoe UI", Roboto, Arial, sans-serif; margin: 16px; }
  .card { border-bottom: 1px solid #1f1f23; max-width: 760px; }
  .head { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .head img { width: 40px; height: 53px; border-radius: 2px; }
  .head p { margin: 0; }
  .muted { color: #adadb8; font-size: 12px; }
  .details { padding: 8px 0 14px; }
  .tw-tower { display: flex; gap: 8px; }
</style>
</head>
<body>

<ul role="tablist" style="display:flex; list-style:none; margin:0 0 16px; padding:0;">
  <li role="presentation"><a href="/drops/inventory" role="tab" aria-selected="false" style="color:#efeff1;padding:8px 10px;display:block;">Инвентарь</a></li>
  <li role="presentation"><a href="/drops/campaigns" role="tab" aria-selected="true" style="color:#bf94ff;padding:8px 10px;display:block;">Все кампании</a></li>
</ul>

<div id="list"></div>

<script>
  const GAMES = [
    { id: 'bf', name: 'Battlefield 6', gameId: '2005_IGDB', campaign: 'BF Creator Program Drops',
      rewards: ['Cranium Radium', 'Ground Truth', 'Radiant Menace', 'Red Ghost Saboteur'], ends: 'пт, 4 дек., 07:59 gmt+3' },
    { id: 'fh', name: 'For Honor', gameId: '490382', campaign: 'FH EntireDirectory Oct26',
      rewards: ['2boost1crate', '4XP', '4XP Plus'], ends: 'чт, 12 нояб., 19:59 gmt+3' }
  ];

  document.getElementById('list').innerHTML = GAMES.map(function (g) {
    return '<div class="card" data-game="' + g.id + '">' +
      '<div class="head accordion-header" role="heading" aria-level="3">' +
        '<button aria-expanded="false" style="display:flex;align-items:center;gap:12px;flex:1;background:none;border:0;color:inherit;text-align:left;cursor:pointer;">' +
          '<img alt="' + g.name + '" class="tw-image" src="https://static-cdn.jtvnw.net/ttv-boxart/' + g.gameId + '-120x160.jpg">' +
          '<div style="flex:1"><p class="core">' + g.name + '</p><p class="muted">издатель</p></div>' +
          '<span class="muted">пт, 6 нояб., 08:00 - ' + g.ends.replace('gmt+3', 'GMT+3') + '</span>' +
        '</button>' +
      '</div>' +
      '<div class="details"></div>' +
    '</div>';
  }).join('');

  document.querySelectorAll('.accordion-header button').forEach(function (button, index) {
    button.addEventListener('click', function () {
      const game = GAMES[index];
      const card = button.closest('.card');
      const details = card.querySelector('.details');
      if (button.getAttribute('aria-expanded') === 'true') {
        button.setAttribute('aria-expanded', 'false');
        details.innerHTML = '';
        return;
      }
      button.setAttribute('aria-expanded', 'true');
      setTimeout(function () {
        details.innerHTML = '<strong>' + game.campaign + '</strong>' +
          '<div class="ScTower tw-tower">' + game.rewards.map(function (name) {
            return '<div class="khtvTe"><p class="CoreText gUQtFU">' + name + '</p></div>';
          }).join('') + '</div>';
      }, 120);
    });
  });

  // кэш уже заполнен: у кампаний есть даты окончания, совпадающие со строками
  const campaigns = {};
  GAMES.forEach(function (g) {
    campaigns[g.campaign.toLowerCase()] = {
      title: g.campaign, gameId: g.gameId, ends: g.ends,
      total: g.rewards.length, earned: g.rewards.length, done: true,
      names: g.rewards, fp: 'x', at: Date.now()
    };
  });

  localStorage.setItem('tak_inventoryStats', JSON.stringify({
    at: Date.now(), games: {}, campaigns: campaigns, claimed: {}
  }));
  localStorage.setItem('tak_favoriteGames', JSON.stringify(['Battlefield 6', 'For Honor']));
  localStorage.removeItem('tak_hideCompleted');

  const clicks = { count: 0 };
  document.querySelectorAll('.accordion-header button').forEach(function (b) {
    b.addEventListener('click', function () { clicks.count++; });
  });

  const s = document.createElement('script');
  s.src = '../favorites.js';
  s.onload = () => start();
  document.body.appendChild(s);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function start() {
    const errs = [];
    const ok = (cond, msg) => { if (!cond) errs.push(msg); };
    const finish = () => {
      const pre = document.createElement('pre');
      pre.id = 'result';
      pre.textContent = errs.length ? 'FAIL\n' + errs.join('\n') : 'PASS';
      document.body.appendChild(pre);
      document.title = errs.length ? 'FAIL' : 'PASS';
    };

    await wait(4000);

    try {
      const data = JSON.parse(localStorage.getItem('tak_inventoryStats') || 'null');
      ok(clicks.count === 0, 'строки не должны раскрываться повторно, а было кликов ' + clicks.count);
      ok(Object.keys(data.campaigns).length === 2, 'кэш не должен меняться, а там ' + Object.keys(data.campaigns).length);
      ok(data.campaigns['bf creator program drops'].earned === 4, 'у BF в кэше должно остаться 4/4');

      const expanded = [...document.querySelectorAll('.accordion-header button')]
        .filter((b) => b.getAttribute('aria-expanded') === 'true').length;
      ok(expanded === 0, 'ни один блок не должен раскрыться, а раскрыто ' + expanded);

    } catch (e) {
      errs.push('Исключение: ' + (e && e.stack ? e.stack.split('\n')[0] : e));
    }

    finish();
  }
</script>
</body>
</html>
