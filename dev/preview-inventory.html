<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>preview inventory</title>
<style>
  body { margin: 0; padding: 20px 24px; background: #0e0e10; color: #efeff1;
         font: 14px/1.4 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  .tabs { display: flex; list-style: none; margin: 0 0 18px; padding: 0; gap: 4px; }
  .tabs a { display: block; padding: 10px 12px; color: #efeff1; text-decoration: none; font-weight: 600; }
  .tabs a.active { color: #bf94ff; }
  .camp { max-width: 800px; border-bottom: 1px solid #1f1f23; padding: 12px 0; }
  .title { font: 600 17px/1.3 system-ui, "Segoe UI", Roboto, Arial, sans-serif; margin: 0 0 4px; }
  .title a { color: #efeff1; text-decoration: none; }
  .meta { color: #adadb8; font-size: 12px; margin: 0 0 10px; }
  .body { display: flex; gap: 12px; align-items: flex-start; }
  .boxart { width: 46px; height: 61px; border-radius: 2px; flex: 0 0 auto; background: #26262c; }
  .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .row.dead { opacity: .4; }
  .drop-img { width: 26px; height: 26px; border-radius: 3px; background: #26262c; flex: 0 0 auto; }
  .name { width: 190px; font-size: 12px; color: #adadb8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { flex: 1; height: 4px; background: #2f2f35; border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; background: #9147ff; }
  .pct { color: #adadb8; font-size: 11px; white-space: nowrap; width: 150px; text-align: right; }
</style>
</head>
<body>

<ul class="tabs" role="tablist">
  <li role="presentation"><a href="#" class="active" role="tab" aria-selected="true">Инвентарь</a></li>
  <li role="presentation"><a href="#" role="tab" aria-selected="false">Все кампании</a></li>
  <li role="presentation"><a href="#" role="tab" aria-selected="false">Значок за посты в соцсетях</a></li>
</ul>

<div id="inv"></div>

<script>
  function row(value, dead) {
    return '<div class="row' + (dead ? ' dead' : '') + '">' +
      '<div class="drop-img inventory-drop-image' + (dead ? ' inventory-opacity-2' : '') + '"></div>' +
      '<div class="name">Награда</div>' +
      '<div class="bar tw-progress-bar" role="progressbar" aria-valuenow="' + value + '" aria-valuemin="0" aria-valuemax="100">' +
        '<div class="fill" style="width:' + value + '%"></div>' +
      '</div>' +
      '<div class="pct">' + (dead ? 'больше недоступна' : value + '%') + '</div>' +
      '</div>';
  }

  function campaign(id, name, bars, deadIdx) {
    deadIdx = deadIdx || [];
    return '<div class="camp" data-id="' + id + '">' +
      '<div class="inventory-campaign-info">' +
        '<p class="title"><a href="/drops/campaigns?dropID=' + id + '">' + name + '</a></p>' +
        '<p class="meta"><span>Дата окончания: </span>сб, 7 нояб., 16:59 GMT+3</p>' +
        '<div class="body">' +
          '<div class="boxart"></div>' +
          '<div style="flex:1">' + bars.map(function (v, i) { return row(v, deadIdx.indexOf(i) !== -1); }).join('') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tower"></div>' +
    '</div>';
  }

  document.getElementById('inv').innerHTML = [
    campaign('a', 'Osaka 2026 Play-ins', [100, 100, 85, 56, 42], [2, 3, 4]),
    campaign('b', 'Open Series Cup #3', [100, 100, 100, 100, 81], [4]),
    campaign('c', 'Ocean Expansion Drops', [46, 93, 100])
  ].join('');
</script>

<script src="../favorites.js"></script>
</body>
</html>
