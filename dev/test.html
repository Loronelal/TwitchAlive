<script>
  localStorage.removeItem('tak_favoriteGames');
  localStorage.removeItem('tak_onlyFavorites');
  const fixtureHtml = document.getElementById('campaigns').innerHTML;

  // ?both=1 — проверяем вместе с content.js (он режет таймеры до 1 с)
  if (new URLSearchParams(location.search).has('both')) {
    const c = document.createElement('script');
    c.src = '../content.js';
    document.head.appendChild(c);
  }

  const s = document.createElement('script');
  s.src = '../favorites.js';
  s.onload = () => start();
  document.body.appendChild(s);

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function start() {
    const errs = [];
    const ok = (cond, msg) => { if (!cond) errs.push(msg); };
    const finish = () => {
      const pre = document.createElement('pre');
      pre.id = 'result';
      pre.textContent = errs.length ? 'FAIL\n' + errs.join('\n') : 'PASS';
      document.body.appendChild(pre);
      document.title = errs.length ? 'FAIL' : 'PASS';
    };

    await sleep(300);

    try {

    const group = (g) => document.querySelector('[data-game="' + g + '"]');
    const visible = (el) => !!el && getComputedStyle(el).display !== 'none';
    const star = (g) => group(g).querySelector('.tak-fav-star');
    const count = () => document.querySelector('.tak-fav-count').textContent;
    const mainBtn = () => document.querySelector('.tak-fav-main');
    const panel = () => document.querySelector('.tak-fav-panel');

    // ---------- 1. вкладка в хедере ----------
    const li = document.querySelector('.tak-fav-li');
    ok(!!li, 'пункт «Избранное» не вставлен');
    ok(li && li.parentElement === document.querySelector('ul[role="tablist"]'), 'пункт вставлен не в полосу вкладок');
    ok(li && li.parentElement.children[li.parentElement.children.length - 1] === li, 'пункт стоит не последним');
    ok(count() === '0', 'счётчик должен быть 0, а он ' + count());
    ok(document.querySelectorAll('.tak-fav-star').length === 8, 'ожидалось 8 звёздочек');

    // звезда стоит справа от названия, сразу за текстом, без сдвига текста
    const nameP = [...group('lol').querySelectorAll('p')]
      .find((p) => p.textContent.replace(/[\u2605\u2606]/g, '').trim() === 'League of Legends');
    ok(!!nameP, 'не найден абзац с названием игры');
    ok(nameP && star('lol').parentElement === nameP, 'звезда должна жить внутри абзаца с названием');
    ok(nameP && nameP.style.paddingLeft === '', 'у названия не должно быть отступа слева');
    ok(getComputedStyle(star('lol')).position === 'static', 'звезда должна идти в строке текста');
    ok(getComputedStyle(star('lol')).display === 'inline-block', 'звезда должна быть inline-block');
    if (nameP && nameP.firstChild && nameP.firstChild.nodeType === 3) {
      const range = document.createRange();
      range.selectNodeContents(nameP.firstChild);        // только текст, без звезды
      const textRight = range.getBoundingClientRect().right;
      const starLeft = star('lol').getBoundingClientRect().left;
      ok(starLeft >= textRight - 1 && starLeft - textRight < 16,
        'звезда должна стоять вплотную справа от текста (textRight=' + textRight.toFixed(0) + ', starLeft=' + starLeft.toFixed(0) + ')');
    }

    // звёздочка не избранного скрыта
    ok(star('lol').style.opacity === '0', 'звезда не избранного должна быть скрыта');
    ok(star('lol').getAttribute('aria-pressed') === 'false', 'звезда LoL не должна быть нажата');

    // ---------- 2. ставим звезду ----------
    star('lol').click();
    await sleep(120);
    ok(group('lol').querySelector('button[aria-expanded]').getAttribute('aria-expanded') === 'false',
      'клик по звезде не должен раскрывать карточку');
    ok(star('lol').getAttribute('aria-pressed') === 'true', 'звезда LoL не включилась');
    ok(star('lol').textContent === '\u2605', 'символ звезды должен стать закрашенным');
    ok(star('lol').style.opacity === '1', 'звезда избранного должна быть видимой');
    ok(count() === '1', 'счётчик должен стать 1, а он ' + count());
    ok((localStorage.getItem('tak_favoriteGames') || '').includes('League of Legends'), 'избранное не сохранилось');

    // ---------- 3. фильтр «только избранное» ----------
    mainBtn().click();
    await sleep(120);
    ok(mainBtn().getAttribute('aria-pressed') === 'true', 'фильтр не включился');
    ok(visible(group('lol')), 'LoL должен остаться видимым');
    ok(!visible(group('arknights')), 'ARKNIGHTS должен скрыться при фильтре');
    ok(!visible(group('elden')), 'ELDEN RING должен скрыться при фильтре');
    ok(!visible(group('multiB')), 'Game B должен скрыться при фильтре');
    ok(!visible(document.querySelector('[data-part="multiB"]')), 'детали Game B должны скрыться вместе с заголовком');

    // ---------- 4. выпадающий список ----------
    document.querySelector('.tak-fav-more').click();
    await sleep(120);
    ok(getComputedStyle(panel()).display === 'flex', 'панель не открылась');
    ok(panel().querySelectorAll('li').length === 1, 'в списке должен быть 1 пункт');

    // ---------- 5. фильтр не мешает снимать звезду ----------
    star('lol').click();      // снимаем звезду у единственного избранного
    await sleep(150);
    ok(mainBtn().getAttribute('aria-pressed') === 'false', 'при пустом избранном фильтр должен выключиться');
    ok(visible(group('arknights')), 'ARKNIGHTS должен вернуться после выключения фильтра');
    ok(count() === '0', 'счётчик должен снова стать 0');

    // ---------- 6. две игры в избранном + фильтр + удаление из списка ----------
    star('arknights').click();
    star('oncehuman').click();
    await sleep(120);
    mainBtn().click();
    await sleep(120);
    ok(count() === '2', 'счётчик должен быть 2, а он ' + count());
    ok(visible(group('arknights')) && visible(group('oncehuman')), 'избранные карточки должны быть видны');
    ok(!visible(group('lol')), 'LoL должен быть скрыт фильтром');

    const delFirst = panel().querySelector('li button');
    ok(!!delFirst, 'в списке нет кнопки удаления');
    delFirst.click();
    await sleep(150);
    ok(count() === '1', 'после удаления счётчик должен стать 1, а он ' + count());
    ok(!visible(group('arknights')), 'удалённая из избранного игра должна исчезнуть под фильтром');
    ok(visible(group('oncehuman')), 'вторая избранная игра должна остаться видимой');

    // ---------- 7. очистка списка ----------
    document.querySelector('.tak-fav-clear').click();
    await sleep(150);
    ok(count() === '0', 'после очистки счётчик должен быть 0');
    ok(mainBtn().getAttribute('aria-pressed') === 'false', 'после очистки фильтр должен выключиться');
    ok(visible(group('lol')) && visible(group('elden')), 'после очистки все карточки должны быть видны');

    // ---------- 8. переживаем перерисовку страницы ----------
    star('elden').click();
    mainBtn().click();
    await sleep(150);
    ok(!visible(group('lol')), 'перед перерисовкой фильтр не сработал');

    document.getElementById('campaigns').innerHTML = fixtureHtml;   // React заменил всё дерево
    await sleep(400);
    ok(!!document.querySelector('.tak-fav-li'), 'после перерисовки вкладка «Избранное» не восстановилась');
    ok(document.querySelectorAll('.tak-fav-star').length === 8, 'после перерисовки звёздочки не восстановились');
    ok(star('elden').getAttribute('aria-pressed') === 'true', 'после перерисовки ELDEN RING потерял избранное');
    ok(visible(group('elden')), 'после перерисовки избранная карточка должна быть видна');
    ok(!visible(group('lol')), 'после перерисовки фильтр не применился');
    ok(count() === '1', 'после перерисовки счётчик сбился: ' + count());

    // ---------- 9. чтение сохранённого состояния ----------
    localStorage.setItem('tak_favoriteGames', JSON.stringify(['Where Winds Meet']));
    localStorage.setItem('tak_onlyFavorites', 'true');
    await window.__twitchAliveFav.init();
    await sleep(250);
    ok(count() === '1', 'после перечитывания хранилища счётчик должен быть 1');
    ok(star('winds').getAttribute('aria-pressed') === 'true', 'Where Winds Meet не восстановился как избранный');
    ok(window.__twitchAliveFav.isOnlyFavorites() === true, 'флаг фильтра не восстановился');
    ok(visible(group('winds')), 'избранная карточка должна быть видна');
    ok(!visible(group('elden')), 'неизбранная карточка должна быть скрыта');

    } catch (e) {
      errs.push('Исключение: ' + (e && e.stack ? e.stack.split('\n')[0] : e));
    }

    finish();
  }
</script>
